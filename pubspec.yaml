name: simandoronline
description: Aplikasi pendataan Barang Daerah.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.1.0
  intl: ^0.18.1
  shared_preferences: ^2.2.2
  get: ^4.6.6
  dropdown_search: ^5.0.6
  mobile_scanner: ^5.2.3
  image_picker: ^1.1.2
  geolocator: ^12.0.0
  geocoding: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.3

dependency_overrides:
  file: ^7.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/images/
